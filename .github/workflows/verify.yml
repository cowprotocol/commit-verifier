name: verify commit signatures 🕵🏻‍♂️

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  verify-ssh-signatures:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pins script + allowed_signers to the workflow revision the caller pinned
      - name: 📥 Check out commit-verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: 🔑 Verify SSH commit signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
        run: ./verify_commits.sh "$TARGET"
